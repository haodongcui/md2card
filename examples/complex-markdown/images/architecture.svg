<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Markdown 到卡片导出的系统结构</title>
  <desc id="desc">展示 Markdown、AST、分页、卡片和 ZIP 导出的数据流</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#edf6f8"/><stop offset="1" stop-color="#dbe9ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#31505d" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 10 5.5 0 11z" fill="#5b899b"/></marker>
  </defs>
  <rect width="1400" height="760" rx="34" fill="url(#bg)"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="78" y="105" fill="#21414d" font-size="46" font-weight="700">从 Markdown 到小红书卡片</text>
    <text x="80" y="148" fill="#58727c" font-size="24">同一份页面结构同时服务预览、测量与 PNG 导出</text>
    <g filter="url(#shadow)">
      <rect x="82" y="255" width="220" height="190" rx="20" fill="#fff"/>
      <rect x="390" y="255" width="220" height="190" rx="20" fill="#fff"/>
      <rect x="698" y="255" width="220" height="190" rx="20" fill="#fff"/>
      <rect x="1006" y="255" width="300" height="190" rx="20" fill="#fff"/>
    </g>
    <g fill="#28596a">
      <circle cx="132" cy="309" r="18" fill="#77aabd"/><path d="M125 298h14v22h-14z" fill="#fff"/>
      <circle cx="440" cy="309" r="18" fill="#8ca7bd"/><path d="M432 303h16v4h-16zm0 9h16v4h-16z" fill="#fff"/>
      <circle cx="748" cy="309" r="18" fill="#78a78f"/><path d="M741 304h14v14h-14z" fill="#fff"/>
      <circle cx="1056" cy="309" r="18" fill="#c28178"/><path d="M1049 300h14v18h-14z" fill="#fff"/>
    </g>
    <g fill="#294c58" font-size="30" font-weight="700"><text x="119" y="365">Markdown</text><text x="441" y="365">Document AST</text><text x="756" y="365">PagePlan</text><text x="1056" y="365">PNG ZIP</text></g>
    <g fill="#6b7f86" font-size="21"><text x="109" y="404">图片、公式、表格</text><text x="430" y="404">块级内容与诊断</text><text x="747" y="404">自动分页与标题簇</text><text x="1047" y="404">真实图像与下载</text></g>
    <g fill="none" stroke="#5b899b" stroke-width="9" marker-end="url(#arrow)"><path d="M315 350h58"/><path d="M623 350h58"/><path d="M931 350h58"/></g>
    <rect x="82" y="540" width="1224" height="112" rx="18" fill="#ffffffa8" stroke="#b8d0d8" stroke-width="2"/>
    <text x="122" y="588" fill="#315663" font-size="27" font-weight="700">关键约束</text>
    <text x="122" y="625" fill="#58727c" font-size="23">本地图片以 Blob URL 绑定；测量与预览共享 CSS；导出前等待字体和图片完成加载。</text>
  </g>
</svg>
